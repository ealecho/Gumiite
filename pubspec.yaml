name: sidedeck
description: DJ deck for Android and iPhone. Local files and Subsonic.
publish_to: "none"
version: 1.1.3+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^13.0.1
  ffi: ^2.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  http: ^1.6.0
  crypto: ^3.0.7
  sqflite: ^2.4.3
  file_picker: 8.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Paper and Ink looks (SideDeckTheme): Space Mono for text, Doto (static
  # instances of the variable font, square dots) for readouts. Both OFL;
  # licences beside them.
  fonts:
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
    - family: Doto
      fonts:
        - asset: assets/fonts/Doto-Regular.ttf
        - asset: assets/fonts/Doto-Bold.ttf
          weight: 700
